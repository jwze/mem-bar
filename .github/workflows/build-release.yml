name: Build and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test
        run: BUILD_TIMEOUT=180 ./Scripts/build-app.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/MemBar.app build/MemBar.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MemBar
          path: build/MemBar.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MemBar
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/MemBar.zip --title "MemBar $GITHUB_REF_NAME" --generate-notes
